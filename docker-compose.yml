# Production-like stack: `docker compose up --build` → http://localhost:3000
services:
  backend:
    build:
      context: .
      target: backend
    environment:
      - PORT=4000
      - NODE_COUNT=250
      - TICK_MS=250
      - UPDATE_RATIO=0.3
    expose:
      - "4000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
